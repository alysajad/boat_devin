services:
  multiplayer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: multiplayer
    restart: unless-stopped
    expose:
      - "6020"
      - "6120"
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      multiplayer:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
